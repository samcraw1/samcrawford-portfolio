<svg width="100%" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>text { font-family: -apple-system, system-ui, sans-serif; }</style>

<text x="300" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#141413">Step 1: Bootstrap — Remote State Backend</text>
<text x="300" y="48" text-anchor="middle" font-size="11" fill="#737268">Foundation that every other module depends on</text>

<!-- Terraform CLI -->
<rect x="200" y="70" width="200" height="40" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="300" y="90" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Terraform CLI</text>
<text x="300" y="103" text-anchor="middle" font-size="10" fill="#5f5e5a">Local state (chicken-and-egg)</text>

<line x1="250" y1="110" x2="180" y2="155" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="350" y1="110" x2="420" y2="155" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

<!-- S3 Bucket -->
<rect x="60" y="158" width="240" height="70" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="180" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#712b13">S3 State Bucket</text>
<text x="180" y="196" text-anchor="middle" font-size="10" fill="#993c1d">Versioned + AES-256 encrypted</text>
<text x="180" y="210" text-anchor="middle" font-size="10" fill="#993c1d">Public access blocked + prevent_destroy</text>

<!-- DynamoDB -->
<rect x="320" y="158" width="220" height="70" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="430" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#712b13">DynamoDB Lock Table</text>
<text x="430" y="196" text-anchor="middle" font-size="10" fill="#993c1d">LockID hash key</text>
<text x="430" y="210" text-anchor="middle" font-size="10" fill="#993c1d">PAY_PER_REQUEST billing</text>

<!-- Why box -->
<rect x="60" y="255" width="480" height="50" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="300" y="275" text-anchor="middle" font-size="11" fill="#444441">Why: Prevents two engineers from corrupting state by writing at the same time.</text>
<text x="300" y="292" text-anchor="middle" font-size="11" fill="#444441">S3 stores the state files. DynamoDB locks them during apply.</text>
</svg>
