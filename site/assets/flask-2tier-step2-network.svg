<svg width="100%" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>text { font-family: -apple-system, system-ui, sans-serif; }</style>

<text x="350" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#141413">Step 2: Network — VPC + 3-Tier Subnets</text>
<text x="350" y="48" text-anchor="middle" font-size="11" fill="#737268">Defense-in-depth networking across 2 AZs</text>

<!-- VPC Box -->
<rect x="30" y="65" width="640" height="370" rx="10" fill="none" stroke="#993c1d" stroke-width="0.5" stroke-dasharray="6 3"/>
<text x="50" y="85" font-size="11" font-weight="500" fill="#993c1d">VPC 10.0.0.0/16</text>

<!-- AZ labels -->
<text x="210" y="105" text-anchor="middle" font-size="10" font-weight="500" fill="#737268">us-east-1a</text>
<text x="490" y="105" text-anchor="middle" font-size="10" font-weight="500" fill="#737268">us-east-1b</text>

<!-- Public Subnets -->
<rect x="60" y="115" width="260" height="55" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="190" y="135" text-anchor="middle" font-size="12" font-weight="500" fill="#712b13">Public Subnet</text>
<text x="190" y="150" text-anchor="middle" font-size="10" fill="#993c1d">ALB + NAT Gateway → IGW</text>

<rect x="380" y="115" width="260" height="55" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="510" y="135" text-anchor="middle" font-size="12" font-weight="500" fill="#712b13">Public Subnet</text>
<text x="510" y="150" text-anchor="middle" font-size="10" fill="#993c1d">ALB + NAT Gateway → IGW</text>

<!-- Private Subnets -->
<rect x="60" y="185" width="260" height="70" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="190" y="205" text-anchor="middle" font-size="12" font-weight="500" fill="#712b13">Private App Subnet</text>
<text x="190" y="220" text-anchor="middle" font-size="10" fill="#993c1d">Fargate tasks (no public IP)</text>
<text x="190" y="235" text-anchor="middle" font-size="10" fill="#993c1d">Route: 0.0.0.0/0 → local NAT</text>

<rect x="380" y="185" width="260" height="70" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="510" y="205" text-anchor="middle" font-size="12" font-weight="500" fill="#712b13">Private App Subnet</text>
<text x="510" y="220" text-anchor="middle" font-size="10" fill="#993c1d">Fargate tasks (no public IP)</text>
<text x="510" y="235" text-anchor="middle" font-size="10" fill="#993c1d">Route: 0.0.0.0/0 → local NAT</text>

<!-- DB Subnets -->
<rect x="60" y="270" width="260" height="55" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="190" y="290" text-anchor="middle" font-size="12" font-weight="500" fill="#712b13">Isolated DB Subnet</text>
<text x="190" y="305" text-anchor="middle" font-size="10" fill="#993c1d">RDS only — NO default route</text>

<rect x="380" y="270" width="260" height="55" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="510" y="290" text-anchor="middle" font-size="12" font-weight="500" fill="#712b13">Isolated DB Subnet</text>
<text x="510" y="305" text-anchor="middle" font-size="10" fill="#993c1d">RDS only — NO default route</text>

<!-- VPC Endpoints -->
<rect x="120" y="345" width="460" height="40" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="350" y="362" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">VPC Endpoints: S3 (gateway) + ECR API + ECR DKR + Secrets Manager + CloudWatch Logs</text>
<text x="350" y="377" text-anchor="middle" font-size="10" fill="#5f5e5a">Private traffic stays off the public internet</text>

<!-- Key callout -->
<rect x="120" y="400" width="460" height="30" rx="6" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="350" y="420" text-anchor="middle" font-size="11" fill="#444441">Per-AZ NAT: if one AZ fails, the other keeps working independently</text>
</svg>
