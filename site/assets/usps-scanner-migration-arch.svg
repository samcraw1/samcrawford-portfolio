<svg width="100%" viewBox="0 0 780 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: "Anthropic Sans", -apple-system, system-ui, "Segoe UI", sans-serif; }
</style>

<!-- Title -->
<text x="390" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="rgb(20,20,19)">USPS Vehicle Inspection — AWS Backend Architecture</text>
<text x="390" y="52" text-anchor="middle" font-size="12" fill="rgb(115,114,108)">Serverless inspection pipeline — DynamoDB + S3 + Lambda + API Gateway</text>

<!-- Mobile App -->
<rect x="265" y="74" width="250" height="44" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="390" y="91" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">USPS Scanner App</text>
<text x="390" y="107" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(95,94,90)">React Native — Camera + OpenAI GPT-4o</text>

<!-- Arrow: App → API Gateway -->
<line x1="390" y1="118" x2="390" y2="148" stroke="rgb(115,114,108)" stroke-width="1" marker-end="url(#arrow)"/>
<text x="420" y="137" font-size="9" fill="rgb(115,114,108)">POST /inspections</text>

<!-- API Gateway -->
<rect x="275" y="150" width="230" height="40" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
<text x="390" y="165" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113,43,19)">API Gateway</text>
<text x="390" y="181" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(153,60,29)">REST API + CORS</text>

<!-- Arrow: API GW → Lambda -->
<line x1="390" y1="190" x2="390" y2="220" stroke="rgb(115,114,108)" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Lambda -->
<rect x="250" y="222" width="280" height="50" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
<text x="390" y="241" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113,43,19)">Lambda — usps-submit-inspection</text>
<text x="390" y="259" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(153,60,29)">Node.js 20 — parses payload, stores data</text>

<!-- Arrow: Lambda → DynamoDB -->
<line x1="320" y1="272" x2="220" y2="332" stroke="rgb(115,114,108)" stroke-width="1" marker-end="url(#arrow)"/>
<text x="240" y="300" font-size="9" fill="rgb(115,114,108)">PutItem</text>

<!-- Arrow: Lambda → S3 -->
<line x1="460" y1="272" x2="560" y2="332" stroke="rgb(115,114,108)" stroke-width="1" marker-end="url(#arrow)"/>
<text x="530" y="300" font-size="9" fill="rgb(115,114,108)">PutObject</text>

<!-- DynamoDB -->
<rect x="80" y="334" width="280" height="60" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
<text x="220" y="355" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113,43,19)">DynamoDB</text>
<text x="220" y="373" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(153,60,29)">usps-vehicle-inspections — on-demand billing</text>
<text x="220" y="387" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(153,60,29)">PK: inspectionId | SK: timestamp</text>

<!-- S3 -->
<rect x="420" y="334" width="280" height="60" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
<text x="560" y="355" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113,43,19)">S3 Bucket</text>
<text x="560" y="373" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(153,60,29)">usps-vehicle-images — AES-256 encrypted</text>
<text x="560" y="387" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(153,60,29)">inspections/{id}/photo.jpg</text>

<!-- IAM bar -->
<rect x="80" y="420" width="620" height="8" rx="4" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.3"/>
<text x="390" y="445" text-anchor="middle" font-size="10" fill="rgb(153,60,29)">IAM — least privilege: DynamoDB PutItem + S3 PutObject + CloudWatch Logs</text>

<!-- OpenAI -->
<text x="390" y="480" text-anchor="middle" font-size="12" font-weight="500" fill="rgb(20,20,19)">Third-Party API (unchanged)</text>

<rect x="290" y="495" width="200" height="44" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="390" y="511" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(68,68,65)">OpenAI</text>
<text x="390" y="527" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(95,94,90)">GPT-4o vision — vehicle analysis</text>

<!-- Arrow: App → OpenAI (dashed, side) -->
<line x1="515" y1="96" x2="630" y2="96" stroke="rgb(115,114,108)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="630" y1="96" x2="630" y2="517" stroke="rgb(115,114,108)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="630" y1="517" x2="492" y2="517" stroke="rgb(115,114,108)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="648" y="300" font-size="9" fill="rgb(115,114,108)" transform="rotate(90, 648, 300)">base64 image → AI analysis</text>

<!-- Data Flow Summary -->
<text x="390" y="575" text-anchor="middle" font-size="15" font-weight="600" fill="rgb(20,20,19)">Data Flow</text>

<rect x="60" y="592" width="660" height="100" rx="10" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="390" y="616" text-anchor="middle" font-size="12" fill="rgb(68,68,65)">1. Carrier takes photo → OpenAI GPT-4o analyzes vehicle condition</text>
<text x="390" y="638" text-anchor="middle" font-size="12" fill="rgb(68,68,65)">2. Carrier taps SUBMIT → App POSTs inspection + image to API Gateway</text>
<text x="390" y="660" text-anchor="middle" font-size="12" fill="rgb(68,68,65)">3. Lambda stores record in DynamoDB + uploads photo to S3</text>
<text x="390" y="682" text-anchor="middle" font-size="12" fill="rgb(68,68,65)">4. App shows confirmation with inspection ID</text>

<!-- Footer -->
<text x="390" y="715" text-anchor="middle" font-size="11" fill="rgb(115,114,108)">4 AWS services — fully serverless, pay-per-use, no servers to manage</text>

</svg>
