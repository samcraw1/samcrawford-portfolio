<!-- Footer summary -->
<text x="390" y="965" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(115,114,108)">Why this stack — Server Components mean no spinners, no stale cache, real data on first paint.</text>
<text x="390" y="983" text-anchor="middle" font-size="11" fill="rgb(115,114,108)">Pure-function engine means the deadline math is testable in isolation, separate from DB writes.</text>
<text x="390" y="1001" text-anchor="middle" font-size="11" fill="rgb(115,114,108)">RLS means multi-tenant is a config change, not a rewrite.</text>

